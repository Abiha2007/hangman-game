<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman — EF101-P01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1d33;--bg2:#14506b;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--ink:#eef6fb;--mute:#9fb8c9;--accent:#ffb84d;--good:#5fd6a4;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:20px 16px 40px}
.wrap{max-width:1000px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:0;font-weight:800;letter-spacing:.5px}
header p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(8px)}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.levels button{flex:1;min-width:90px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.levels button.on{background:var(--accent);color:#1b2a38;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.stat{background:rgba(0,0,0,.2);border-radius:14px;padding:8px;text-align:center}
.stat small{display:block;color:var(--mute);font-size:.8rem}
.stat b{font-size:1.5rem}
.stage{display:flex;justify-content:center}
svg{width:190px;height:170px}
svg .g{stroke:var(--mute);stroke-width:4;fill:none;stroke-linecap:round}
svg .p{stroke:var(--bad);stroke-width:5;fill:none;stroke-linecap:round;display:none}
svg .p.show{display:inline}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 6px;min-height:58px}
.slot{width:40px;height:52px;border-bottom:4px solid var(--accent);display:grid;place-items:center;font-size:2rem;font-weight:800}
.msg{text-align:center;min-height:28px;font-weight:700}
.msg.win{color:var(--good)}.msg.lose{color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:6px;margin:12px 0}
.keys button{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.keys button:hover:not(:disabled){background:rgba(255,255,255,.22)}
.keys button.hit{background:var(--good);color:#0b2a1e;border-color:var(--good)}
.keys button.miss{background:var(--bad);color:#fff;border-color:var(--bad);opacity:.55}
.keys button:disabled{cursor:not-allowed}
.act{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:#1b2a38;font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
h2{margin:0;font-size:1.3rem}
.lbhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
ol{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);align-items:center}
li:nth-child(1) .rk{color:#ffd76a}li:nth-child(2) .rk{color:#d8e2ea}li:nth-child(3) .rk{color:#e0a070}
.rk{font-weight:800}.nm small{display:block;color:var(--mute);font-size:.75rem}
.note{color:var(--mute);font-size:.8rem;margin:10px 0 0}
dialog{border:1px solid var(--line);border-radius:18px;background:#10304a;color:var(--ink);padding:22px;font-family:inherit;max-width:340px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font:inherit;margin:10px 0 14px}
footer{text-align:center;color:var(--mute);margin-top:22px;font-size:.9rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:no-preference){.slot{transition:transform .2s}.slot.pop{transform:translateY(-8px);color:var(--good)}svg.shake{animation:shake .35s}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Hangman</h1><p>Guess the hidden word one letter at a time.</p></header>
<div class="grid">
<main class="card">
<div class="levels" id="levels">
<button data-l="easy" class="on">Easy</button><button data-l="medium">Medium</button><button data-l="hard">Hard</button>
</div>
<div class="stats">
<div class="stat"><small>Attempts left</small><b id="left">—</b></div>
<div class="stat"><small>Current score</small><b id="score">0</b></div>
<div class="stat"><small>Win streak</small><b id="streak">0</b></div>
<div class="stat"><small>Word length</small><b id="len">—</b></div>
</div>
<div class="stage"><svg viewBox="0 0 190 170" aria-label="Hangman drawing">
<path class="g" d="M20 160H100M60 160V15H135V35"/>
<circle class="p" cx="135" cy="50" r="15"/>
<path class="p" d="M135 65V105"/>
<path class="p" d="M135 75L115 92"/>
<path class="p" d="M135 75L155 92"/>
<path class="p" d="M135 105L118 135"/>
<path class="p" d="M135 105L152 135"/>
<path class="p" d="M128 46l4 4M132 46l-4 4"/>
<path class="p" d="M138 46l4 4M142 46l-4 4"/>
</svg></div>
<div class="word" id="word" aria-live="polite"></div>
<div class="msg" id="msg">Pick a difficulty and start guessing.</div>
<div class="keys" id="keys"></div>
<div class="act"><button class="btn" id="new">New game</button><button class="btn ghost" id="hint">Hint (-15)</button><button class="btn ghost" id="reset">Reset run</button><button class="btn ghost" id="snd">Sound on</button></div>
</main>
<aside class="card">
<div class="lbhead"><h2>Leaderboard</h2><button class="btn ghost" id="refresh">Refresh</button></div>
<ol id="lb"></ol>
<p class="note">Top 50 scores. Saved in this browser, so they stay after you close it.</p>
</aside>
</div>
<footer>EF101-P01 Hangman, made by Abiha</footer>
</div>
<dialog id="dlg"><form method="dialog" id="form">
<h2>Run over</h2><p id="final" style="margin:6px 0;color:var(--mute)"></p>
<label for="name">Your name</label><input id="name" maxlength="16" autocomplete="off" required>
<div class="act"><button class="btn">Save score</button><button class="btn ghost" type="button" id="skip">Skip</button></div>
</form></dialog>
<script>
const FALLBACK={
easy:"cat dog sun moon star tree fish bird cake milk rain book door ship road farm lamp bell frog wolf king rose gold snow wind fire sand leaf coin desk fork nest tent bean pear lion duck goat".split(" "),
medium:"planet bridge garden window pencil rocket guitar jungle castle island camera dragon basket flower market silver mirror winter summer cookie turtle monkey pirate ladder button bottle".split(" "),
hard:"adventure mountain chocolate telescope dinosaur hurricane butterfly lighthouse waterfall encyclopedia astronomer pineapple crocodile blacksmith university electricity programming championship thunderstorm kaleidoscope".split(" ")};
const LV={easy:{tries:8,mult:1,min:3,max:5},medium:{tries:7,mult:2,min:6,max:8},hard:{tries:6,mult:3,min:9,max:30}};
const $=id=>document.getElementById(id);
let pool=null,level="easy",word="",guessed=new Set(),wrong=0,score=0,over=false,KEY="hangman_ef101_lb",streak=0,hinted=false,sound=true,AC;
function beep(f,d=.12){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const parts=[...document.querySelectorAll("svg .p")];

async function loadWords(){
  try{const r=await fetch("words.json",{cache:"no-store"});if(!r.ok)throw 0;
    const a=(await r.json()).map(w=>String(w).trim().toUpperCase()).filter(w=>/^[A-Z]{3,30}$/.test(w));
    if(a.length>50)return a;}catch(e){}
  return Object.values(FALLBACK).flat().map(w=>w.toUpperCase());
}
function pick(){
  const {min,max}=LV[level];
  let c=pool.filter(w=>w.length>=min&&w.length<=max);
  if(!c.length)c=pool;
  return c[Math.floor(Math.random()*c.length)];
}
function buildKeys(){
  $("keys").innerHTML="";
  for(const ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ"){
    const b=document.createElement("button");b.textContent=ch;b.dataset.k=ch;b.onclick=()=>guess(ch);$("keys").appendChild(b);}
}
function render(){
  const t=LV[level].tries;
  $("left").textContent=t-wrong;$("score").textContent=score;$("streak").textContent=streak;$("hint").disabled=over||hinted;$("len").textContent=word.length;
  $("word").innerHTML=[...word].map(c=>`<div class="slot">${guessed.has(c)||over?c:""}</div>`).join("");
  parts.forEach((p,i)=>p.classList.toggle("show",i<Math.ceil(wrong*parts.length/t)));
  document.querySelectorAll(".keys button").forEach(b=>{
    const k=b.dataset.k,u=guessed.has(k);
    b.disabled=u||over;b.className=u?(word.includes(k)?"hit":"miss"):"";});
}
function start(){
  word=pick();guessed=new Set();wrong=0;over=false;hinted=false;
  $("msg").className="msg";$("msg").textContent="Guess a letter.";
  render();
}
function guess(k){
  if(over||guessed.has(k))return;
  guessed.add(k);
  if(!word.includes(k)){wrong++;beep(180);const v=document.querySelector("svg");v.classList.remove("shake");void v.offsetWidth;v.classList.add("shake");}else beep(520,.08);
  const t=LV[level].tries;
  if([...word].every(c=>guessed.has(c))){
    const gain=word.length*10*LV[level].mult+(t-wrong)*5+streak*10;
    score+=gain;streak++;over=true;beep(760,.25);
    setTimeout(()=>document.querySelectorAll(".slot").forEach((e,i)=>setTimeout(()=>e.classList.add("pop"),i*70)),0);
    $("msg").className="msg win";$("msg").textContent=`Correct! +${gain} points${streak>1?" (streak bonus included)":""}. Press New game to continue.`;
  }else if(wrong>=t){
    over=true;streak=0;beep(120,.4);$("msg").className="msg lose";$("msg").textContent=`Out of attempts. The word was ${word}.`;
    render();endRun();return;
  }
  render();
}
function getLB(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}function getLB(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function setLB(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function drawLB(){
  const a=getLB();
  $("lb").innerHTML=a.length?a.map((e,i)=>`<li><span class="rk">${i+1}</span><span class="nm">${esc(e.name)}<small>${e.level} · ${e.date}</small></span><b>${e.score}</b></li>`).join(""):"<li><span></span><span class='nm'>No scores yet. Be the first.</span></li>";
}
function endRun(){
  if(score<=0){score=0;return;}
  $("final").textContent=`You scored ${score} points on ${level}.`;
  $("dlg").showModal();$("name").focus();
}
$("form").addEventListener("submit",()=>{
  const a=getLB();
  a.push({name:$("name").value.trim()||"Player",score,level,date:new Date().toLocaleDateString()});
  a.sort((x,y)=>y.score-x.score);setLB(a.slice(0,50));
  score=0;$("name").value="";drawLB();render();
});
$("skip").onclick=()=>{$("dlg").close();score=0;render();};
$("new").onclick=start;
$("reset").onclick=()=>{score=0;streak=0;start();};
$("refresh").onclick=drawLB;
$("hint").onclick=()=>{if(over||hinted)return;const r=[...word].filter(c=>!guessed.has(c));if(!r.length)return;hinted=true;score=Math.max(0,score-15);guess(r[Math.floor(Math.random()*r.length)]);};
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"Sound on":"Sound off";};
$("levels").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  level=b.dataset.l;score=0;streak=0;
  document.querySelectorAll("#levels button").forEach(x=>x.classList.toggle("on",x===b));
  start();
};
document.addEventListener("keydown",e=>{
  if($("dlg").open||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toUpperCase();
  if(/^[A-Z]$/.test(k))guess(k);
});loadWords().then(function(w){pool=w;buildKeys();drawLB();start();});
</script>
</body>
</html>
